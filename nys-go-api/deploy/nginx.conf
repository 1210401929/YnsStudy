worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # =========================================================
    # 压缩
    #
    # 默认只压缩 text/html，JS/CSS/JSON/XML 需要显式声明。
    # AI 的 SSE 接口在自己的 location 里单独关闭了 gzip。
    # =========================================================
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # =========================================================
    # HTTP 统一跳转到 https://ynsstudy.cn
    # =========================================================
    server {
        listen 80;
        server_name ynsstudy.cn www.ynsstudy.cn;

        return 301 https://ynsstudy.cn$request_uri;
    }

    # =========================================================
    # HTTPS 的 www 统一跳转到主域名，避免同一内容出现两个站点
    # =========================================================
    server {
        listen 443 ssl;
        server_name www.ynsstudy.cn;

        ssl_certificate /usr/local/nginx/ynsstudy.cn_bundle.crt;
        ssl_certificate_key /usr/local/nginx/ynsstudy.cn.key;

        ssl_session_timeout 5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;

        return 301 https://ynsstudy.cn$request_uri;
    }

    # =========================================================
    # YnsStudy 主站 HTTPS
    # =========================================================
    server {
        listen 443 ssl;
        server_name ynsstudy.cn;

        # 腾讯云 SSL 证书
        ssl_certificate /usr/local/nginx/ynsstudy.cn_bundle.crt;
        ssl_certificate_key /usr/local/nginx/ynsstudy.cn.key;

        ssl_session_timeout 5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;

        # Vue 打包后的 dist 目录
        root /var/www/vue_dist;
        index index.html;

        # 不存在的地址返回真正的 404 状态码，内容仍是 index.html，
        # 由 Vue 显示站内 404 页面（不再是“软 404”）。
        error_page 404 /index.html;

        # =====================================================
        # SEO：首页（Go 输出网站介绍和最新文章链接，随后 Vue 接管）
        # =====================================================
        location = / {
            proxy_pass http://152.136.247.100:8889;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # =====================================================
        # SEO：博客详情页（Go 输出真实正文，随后 Vue 接管）
        # proxy_pass 后面不要添加 /api/，也不要添加结尾斜杠。
        # =====================================================
        location ~ ^/oneBlog/[^/]+/?$ {
            proxy_pass http://152.136.247.100:8889;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # =====================================================
        # SEO：作者主页 /user/编号（Go 输出名字、简介和文章列表，随后 Vue 接管）
        #
        # 搜索作者名字（例如“余南松”）时的落地页。
        # 带文章编号的 /user/编号/文章编号 不走这里，仍由下面的 Vue 路由处理。
        # =====================================================
        location ~ ^/user/[^/]+/?$ {
            proxy_pass http://152.136.247.100:8889;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # =====================================================
        # SEO：便签墙
        #   /note/编号          单条随记（Go 输出正文，随后 Vue 接管）
        #   /ynsStudy/Notes     便签墙首页（Go 输出最新随记链接，随后 Vue 接管）
        # =====================================================
        location ~ ^/note/[^/]+/?$ {
            proxy_pass http://152.136.247.100:8889;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location = /ynsStudy/Notes {
            proxy_pass http://152.136.247.100:8889;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # =====================================================
        # SEO：文章归档 /archive、/archive/page/N（Go 输出的完整页面）
        # =====================================================
        location ~ ^/archive(/page/[0-9]+)?/?$ {
            proxy_pass http://152.136.247.100:8889;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # =====================================================
        # SEO：动态 Sitemap
        # =====================================================
        location = /sitemap.xml {
            proxy_pass http://152.136.247.100:8889;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # =====================================================
        # SEO：正式 RSS XML
        # =====================================================
        location = /rss.xml {
            proxy_pass http://152.136.247.100:8889;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # =====================================================
        # SEO：IndexNow 密钥文件（Go 根据 seo.indexnow_key 返回）
        # =====================================================
        location = /indexnow.txt {
            proxy_pass http://152.136.247.100:8889;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =====================================================
        # SEO：robots.txt（文件来自 /var/www/vue_dist/robots.txt）
        # =====================================================
        location = /robots.txt {
            try_files /robots.txt =404;
        }

        # =====================================================
        # 重复地址统一 301
        # =====================================================
        location = /welcome {
            return 301 /;
        }

        location ~ ^/ynsStudy/?$ {
            return 301 /ynsStudy/Home;
        }

        # 原“社区”改名为便签墙
        location ~ ^/ynsStudy/Community/?$ {
            return 301 /ynsStudy/Notes;
        }

        # =====================================================
        # 打包产物：文件名带 hash，可以长期缓存
        # =====================================================
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # =====================================================
        # RSS Vue 阅读页面：可以访问，但不参与搜索排名
        # =====================================================
        location = /rss {
            add_header X-Robots-Tag "noindex, follow" always;
            add_header Cache-Control "no-cache" always;
            try_files /index.html =404;
        }

        # =====================================================
        # 已知的 Vue 前端路由，返回 index.html（200）
        #
        # 以后在 Vue router 里新增页面时，要同步加到这里，
        # 否则该地址会返回 404。
        # =====================================================
        # 栏目页的原始 HTML 是 Vue 空壳，没有 canonical；在响应头里声明规范网址是不带结尾斜杠的栏目地址，
        # 避免谷歌把几个栏目页当成重复网页。发表页（MyBlog）本身是 noindex，声明 canonical 也不影响。
        location ~ "^/ynsStudy/(?<column_path>Home|MyBlog|MyBlog/content|Resources|Notes|FriendLink|About)/?$" {
            add_header Cache-Control "no-cache" always;
            add_header Link "<https://ynsstudy.cn/ynsStudy/$column_path>; rel=\"canonical\"" always;
            try_files /index.html =404;
        }

        # =====================================================
        # 作者主页中打开某篇文章：/user/编号/文章编号（/user/编号 本身由上面的 Go 处理）
        #
        # 页面里显示的就是那篇文章的正文，和 /oneBlog/文章编号 内容重复。
        # 原始 HTML 是 Vue 空壳，没有 canonical，所以在响应头里声明规范网址是文章页，
        # 避免谷歌把两者当成重复网页并自己另选规范网址。
        # 编号只允许字母、数字、_ 和 -，防止往响应头里塞入特殊字符。
        # =====================================================
        location ~ "^/user/(?<profile_id>[0-9A-Za-z_-]+)/(?<article_id>[0-9A-Za-z_-]+)/?$" {
            add_header Cache-Control "no-cache" always;
            add_header Link "<https://ynsstudy.cn/oneBlog/$article_id>; rel=\"canonical\"" always;
            try_files /index.html =404;
        }

        # 旧版作者主页：/userV2/编号/文章编号 的规范网址是文章页，/userV2/编号 的规范网址是 /user/编号
        location ~ "^/userV2/(?<profile_id>[0-9A-Za-z_-]+)/(?<article_id>[0-9A-Za-z_-]+)/?$" {
            add_header Cache-Control "no-cache" always;
            add_header Link "<https://ynsstudy.cn/oneBlog/$article_id>; rel=\"canonical\"" always;
            try_files /index.html =404;
        }

        location ~ "^/userV2/(?<profile_id>[0-9A-Za-z_-]+)/?$" {
            add_header Cache-Control "no-cache" always;
            add_header Link "<https://ynsstudy.cn/user/$profile_id>; rel=\"canonical\"" always;
            try_files /index.html =404;
        }

        location ~ ^/personInfomation/[^/]+/?$ {
            add_header Cache-Control "no-cache" always;
            try_files /index.html =404;
        }

        location ~ ^/(sso|personalCenter|YnsStudyAi|lulu)/?$ {
            add_header Cache-Control "no-cache" always;
            try_files /index.html =404;
        }

        # =====================================================
        # 噜噜独立素材
        #
        # 请求地址：/picture/lulu/benti/lulu_fadai.png
        # 实际文件：/var/www/lulu/benti/lulu_fadai.png
        # =====================================================
        location ^~ /picture/lulu/ {
            alias /var/www/lulu/;

            autoindex off;
            etag on;

            # 替换同名图片后，浏览器会重新校验文件
            add_header Cache-Control "no-cache" always;
        }

        # =====================================================
        # 其他地址：存在的静态文件直接返回，不存在的返回 404
        # （404 的内容由上面的 error_page 交给 index.html）
        # =====================================================
        location / {
            try_files $uri =404;
        }

        # index.html 不缓存，保证发布新版本后立即生效
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        # =====================================================
        # AI API：禁缓冲、禁压缩，支持 SSE
        # =====================================================
        location ^~ /api/ai-api/ {
            proxy_pass http://152.136.247.100:8889/ai-api/;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_buffering off;
            proxy_cache off;

            add_header X-Accel-Buffering no;
            add_header Cache-Control "no-cache, no-transform";

            gzip off;
            proxy_set_header Accept-Encoding "";

            proxy_connect_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # =====================================================
        # 通用 Go API：浏览器访问 /api/xxx，实际转发给 Go 的 /xxx
        # =====================================================
        location ^~ /api/ {
            proxy_pass http://152.136.247.100:8889/;

            # 允许搜索引擎请求接口来渲染页面，但接口返回的 JSON 不作为网页收录
            add_header X-Robots-Tag "noindex" always;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # =====================================================
        # 图片及上传文件代理
        # =====================================================
        location ^~ /uploadFile/ {
            proxy_pass http://152.136.247.100:8889/uploadFile/;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # =========================================================
    # 本地默认服务
    # =========================================================
    server {
        listen 80;
        server_name localhost;

        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root html;
        }
    }
}
